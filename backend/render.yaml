services:
  - type: web
    name: spendpulse-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PROJECT_NAME
        value: "AI-Powered Personal Finance Management and Expense Prediction System"
      - key: API_V1_STR
        value: "/api/v1"
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: "HS256"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: DATABASE_URL
        fromDatabase:
          name: spendpulse-db
          property: connectionString

databases:
  - name: spendpulse-db
    plan: free
    region: oregon
